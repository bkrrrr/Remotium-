# Local stack: server on http://localhost:8080 and a devenv that dials it.
#   docker compose -f deploy/docker-compose.yml up --build
# A second environment:   docker compose -f deploy/docker-compose.yml --profile multi up --build
# Use another server:     REMOTIUM_SERVER_URL=https://tunnels.example.com AGENT_TOKEN=... docker compose ... up devenv

name: remotium

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${REMOTIUM_SERVER_CONFIG_FILE:-./server.dev.toml}:/etc/remotium/server.toml:ro
      - server-state:/var/lib/remotium
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    restart: unless-stopped

  devenv:
    build:
      context: ..
      dockerfile: deploy/devenv/Dockerfile
    environment:
      REMOTIUM_SERVER_URL: ${REMOTIUM_SERVER_URL:-http://server:8080}
      AGENT_ENV_ID: ${AGENT_ENV_ID:-demo}
      AGENT_TOKEN: ${AGENT_TOKEN:-dev-agent-token-demo}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - devenv-data:/data
      - devenv-workspace:/workspace
    restart: unless-stopped

  devenv2:
    profiles: ["multi"]
    build:
      context: ..
      dockerfile: deploy/devenv/Dockerfile
    environment:
      REMOTIUM_SERVER_URL: ${REMOTIUM_SERVER_URL:-http://server:8080}
      AGENT_ENV_ID: demo2
      AGENT_TOKEN: dev-agent-token-demo2
      AGENT_PROJECTS: demo
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - devenv2-data:/data
    restart: unless-stopped

volumes:
  server-state:
  devenv-data:
  devenv-workspace:
  devenv2-data:
