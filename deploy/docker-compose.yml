# Local stack: broker on http://localhost:8080 and a devenv that dials it.
#   docker compose -f deploy/docker-compose.yml up --build
# A second environment:   docker compose -f deploy/docker-compose.yml --profile multi up --build
# Use another broker:     BROKER_URL=https://tunnels.example.com AGENT_TOKEN=... docker compose ... up devenv

name: opentunnel

services:
  broker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.broker
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${BROKER_CONFIG_FILE:-./broker.dev.toml}:/etc/opentunnel/broker.toml:ro
      - broker-state:/var/lib/opentunnel
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    restart: unless-stopped

  devenv:
    build:
      context: ..
      dockerfile: deploy/devenv/Dockerfile
    environment:
      BROKER_URL: ${BROKER_URL:-http://broker:8080}
      AGENT_ENV_ID: ${AGENT_ENV_ID:-demo}
      AGENT_TOKEN: ${AGENT_TOKEN:-dev-agent-token-demo}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - devenv-data:/data
      - devenv-workspace:/workspace
    restart: unless-stopped

  devenv2:
    profiles: ["multi"]
    build:
      context: ..
      dockerfile: deploy/devenv/Dockerfile
    environment:
      BROKER_URL: ${BROKER_URL:-http://broker:8080}
      AGENT_ENV_ID: demo2
      AGENT_TOKEN: dev-agent-token-demo2
      AGENT_PROJECTS: demo
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - devenv2-data:/data
    restart: unless-stopped

volumes:
  broker-state:
  devenv-data:
  devenv-workspace:
  devenv2-data:
