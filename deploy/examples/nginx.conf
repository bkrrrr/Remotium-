# nginx in front of the broker, with oauth2-proxy as the auth proxy.
#
#   browser ──TLS──► nginx ──► broker (127.0.0.1:8080, plain HTTP)
#                      └─ auth_request ─► oauth2-proxy (127.0.0.1:4180)
#
# broker.toml:
#   [server]  listen = "127.0.0.1:8080"   public_url = "https://tunnels.example.com"
#   [auth]    trusted_header = "X-Forwarded-Email"   trusted_proxies = ["127.0.0.1/32"]
#
# oauth2-proxy (any OIDC provider), for example:
#   oauth2-proxy --http-address=127.0.0.1:4180 --reverse-proxy=true \
#     --provider=oidc --oidc-issuer-url=https://idp.example.com --client-id=... --client-secret=... \
#     --cookie-secret=... --email-domain=example.com --set-xauthrequest=true \
#     --redirect-url=https://tunnels.example.com/oauth2/callback

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream opentunnel_broker { server 127.0.0.1:8080; keepalive 16; }

server {
    listen 443 ssl;
    http2 on;
    server_name tunnels.example.com;
    ssl_certificate     /etc/letsencrypt/live/tunnels.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunnels.example.com/privkey.pem;

    # Never let clients set the identity header themselves.
    proxy_set_header X-Forwarded-Email "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- oauth2-proxy endpoints ---
    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }
    location = /oauth2/auth {
        internal;
        proxy_pass http://127.0.0.1:4180;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # --- Paths authenticated by the broker's own tokens: no proxy login ---
    location ~ ^/(data|agent)/ {
        proxy_pass http://opentunnel_broker;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Editor connections are long-lived; the broker pings every 25 s.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
    location ~ ^/(api/v1/tokens|api/v1/sessions|api/v1/status|healthz) {
        proxy_pass http://opentunnel_broker;
        # Session creation can wait for a server download.
        proxy_read_timeout 15m;
    }

    # --- Everything else (dashboard, /launch, environments, launch tickets): login required ---
    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$scheme://$host$request_uri;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Forwarded-Email $email;
        proxy_pass http://opentunnel_broker;
    }
}

server {
    listen 80;
    server_name tunnels.example.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
