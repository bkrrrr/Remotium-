[package]
name = "opentunnel-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"], optional = true }
bytes = "1.12.2"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
tracing = "0.1.44"
tungstenite = "0.30.0"
yamux = "0.14.1"

[features]
axum = ["dep:axum"]

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full", "test-util"] }
