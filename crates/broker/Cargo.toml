[package]
name = "opentunnel-broker"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.9.2", features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
clap = { version = "4.6.8", features = ["derive", "env"] }
futures = "0.3.34"
hex = "0.4.3"
ipnet = "2.12.2"
opentunnel-protocol = { version = "0.1.0", path = "../protocol" }
rand = "0.10.4"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
yamux = "0.14.1"
