[package]
name = "remotium-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.9.2", features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
bytes = "1.12.2"
clap = { version = "4.6.8", features = ["derive", "env"] }
flate2 = "1.1.11"
futures = "0.3.34"
hex = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
if-addrs = "0.15.0"
libc = "0.2.191"
rand = "0.10.4"
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tungstenite = "0.30.0"

[dev-dependencies]
axum = "0.8.9"
flate2 = "1.1.11"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full", "test-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
