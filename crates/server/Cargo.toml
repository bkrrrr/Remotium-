[package]
name = "remotium-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.9.2", features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
clap = { version = "4.6.8", features = ["derive", "env"] }
futures = "0.3.34"
hex = "0.4.3"
ipnet = { version = "2.12.2", features = ["serde"] }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }
remotium-protocol = { version = "0.1.0", path = "../protocol", features = ["axum"] }
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
toml = "1.2.1"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
yamux = "0.14.1"
bytes = "1.12.2"

[dev-dependencies]
futures = "0.3.34"
remotium-agent = { path = "../agent" }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
