name: Release

# Push a tag like v0.2.0 (after scripts/set-version.sh 0.2.0) to publish:
#  - container images ghcr.io/<owner>/remotium-server and remotium-devenv (amd64 + arm64)
#  - a GitHub Release with remotium-client.vsix and static Linux binaries, plus SHA-256 sums
#  - remotium.client on Open VSX, if the OVSX_PAT secret is set, followed by a store test
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(scripts/check-version.sh "$GITHUB_REF_NAME" | tail -1)" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  images:
    needs: [version, ci]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.arch }} images
        run: |
          set -eu
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          v=${{ needs.version.outputs.version }}
          for img in server devenv; do
            file=deploy/Dockerfile.server; [ "$img" = devenv ] && file=deploy/devenv/Dockerfile
            tag="ghcr.io/$owner/remotium-$img:$v-${{ matrix.arch }}"
            docker build -f "$file" -t "$tag" \
              --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label org.opencontainers.image.version="$v" .
            docker push "$tag"
          done
      - name: Extract binaries
        run: |
          set -eu
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          v=${{ needs.version.outputs.version }}
          arch=$([ "${{ matrix.arch }}" = amd64 ] && echo x86_64 || echo aarch64)
          mkdir -p dist
          c=$(docker create "ghcr.io/$owner/remotium-server:$v-${{ matrix.arch }}")
          docker cp "$c:/usr/local/bin/remotium-server" "dist/remotium-server-$v-linux-$arch-musl"
          docker rm "$c"
          c=$(docker create "ghcr.io/$owner/remotium-devenv:$v-${{ matrix.arch }}")
          docker cp "$c:/usr/local/bin/remotium-agent" "dist/remotium-agent-$v-linux-$arch-gnu"
          docker rm "$c"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/

  manifests:
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-arch tags
        run: |
          set -eu
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          v=${{ needs.version.outputs.version }}
          for img in server devenv; do
            base="ghcr.io/$owner/remotium-$img"
            extra=""
            case "$v" in *-*) ;; *) extra="-t $base:latest" ;; esac   # no "latest" for pre-releases
            # shellcheck disable=SC2086 # $extra is zero or two words on purpose
            docker buildx imagetools create -t "$base:$v" $extra "$base:$v-amd64" "$base:$v-arm64"
          done

  github-release:
    needs: [version, ci, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          v=${{ needs.version.outputs.version }}
          mkdir -p dist
          cp artifacts/remotium-client-vsix/remotium-client.vsix "dist/remotium-client-$v.vsix"
          cp artifacts/binaries-amd64/* artifacts/binaries-arm64/* dist/
          chmod +x dist/remotium-server-* dist/remotium-agent-*
          (cd dist && sha256sum -- * > SHA256SUMS)
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          prerelease=""; case "$v" in *-*) prerelease="--prerelease" ;; esac
          cat > notes.md <<EOF
          Container images:

              docker pull ghcr.io/$owner/remotium-server:$v
              docker pull ghcr.io/$owner/remotium-devenv:$v

          Remotium Client: install \`remotium-client-$v.vsix\` in VSCodium (drag it onto the
          Extensions view), or use the download / install command on your server's dashboard.
          Checksums are in \`SHA256SUMS\`.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --title "Remotium $v" --notes-file notes.md --generate-notes $prerelease

  open-vsx:
    needs: [version, ci, github-release]
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip without a token
        if: env.OVSX_PAT == ''
        run: echo "::notice::OVSX_PAT is not set; not publishing to Open VSX. See docs/releasing.md."
      - uses: actions/setup-node@v4
        if: env.OVSX_PAT != ''
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        if: env.OVSX_PAT != ''
        with:
          name: remotium-client-vsix
          path: vsix
      - name: Publish remotium.client
        if: env.OVSX_PAT != ''
        run: |
          pre=""; case "${{ needs.version.outputs.version }}" in *-*) pre="--pre-release" ;; esac
          npx --yes ovsx@1.3.0 verify-pat remotium -p "$OVSX_PAT"
          npx --yes ovsx@1.3.0 publish vsix/remotium-client.vsix -p "$OVSX_PAT" --skip-duplicate $pre

      # Store test: install the published version from Open VSX, as users will, and run the
      # first-install e2e (setup, restart, remote window) against a local stack.
      - name: Wait until Open VSX serves the new version
        if: env.OVSX_PAT != ''
        run: |
          v=${{ needs.version.outputs.version }}
          for _ in $(seq 1 60); do
            curl -fs "https://open-vsx.org/api/remotium/client/$v" | grep -q '"files"' && exit 0
            sleep 10
          done
          echo "Open VSX doesn't list remotium.client $v after 10 minutes" >&2; exit 1
      - name: Download VSCodium
        if: env.OVSX_PAT != ''
        run: |
          v=$(jq -r '.pinned.version + (if .pinned.release then "." + .pinned.release else "" end)' compat.json)
          mkdir -p "$RUNNER_TEMP/vscodium"
          curl -fsSL "https://github.com/VSCodium/vscodium/releases/download/$v/VSCodium-linux-x64-$v.tar.gz" | tar -xz -C "$RUNNER_TEMP/vscodium"
          echo "VSCODIUM_PATH=$RUNNER_TEMP/vscodium/codium" >> "$GITHUB_ENV"
      - name: Install from Open VSX and connect
        if: env.OVSX_PAT != ''
        env:
          E2E_CODIUM_ARGS: --no-sandbox
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgbm1 libnss3 libasound2t64 >/dev/null
          docker compose -f deploy/docker-compose.yml up --build -d
          for _ in $(seq 1 60); do curl -fs localhost:8080/api/v1/status | grep -q '"envsOnline":1' && break; sleep 2; done
          npm --prefix client ci
          xvfb-run -a node client/test/e2e/first-install.js --vsix "remotium.client@${{ needs.version.outputs.version }}" --work "$RUNNER_TEMP/store-test"
