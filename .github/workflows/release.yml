name: Release

# Push a tag like v0.2.0 (after scripts/set-version.sh 0.2.0) to publish:
#  - a GitHub Release with remotium-host for Linux (static musl) and macOS, each with
#    Remotium Client embedded, plus remotium-client-<version>.vsix and SHA256SUMS
#  - remotium.client on Open VSX, if the OVSX_PAT secret is set, followed by a store test
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: echo "version=$(scripts/check-version.sh "$GITHUB_REF_NAME" | tail -1)" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: [version, ci]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            name: linux-x86_64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            name: linux-aarch64
          - target: x86_64-apple-darwin
            runner: macos-latest
            name: macos-x86_64
          - target: aarch64-apple-darwin
            runner: macos-latest
            name: macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools >/dev/null
      - uses: actions/download-artifact@v8
        with:
          name: remotium-client-vsix
          path: vsix
      - name: Build (client embedded)
        env:
          REMOTIUM_CLIENT_VSIX: ${{ github.workspace }}/vsix/remotium-client.vsix
        run: |
          cargo build --release --locked -p remotium-host --target ${{ matrix.target }}
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/remotium-host" "dist/remotium-host-${{ needs.version.outputs.version }}-${{ matrix.name }}"
      - name: Smoke test
        # The x86_64 macOS build runs on the arm64 runner through Rosetta, if installed; skip it.
        if: matrix.name != 'macos-x86_64'
        run: |
          "dist/remotium-host-${{ needs.version.outputs.version }}-${{ matrix.name }}" --version
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.name }}
          path: dist/

  github-release:
    needs: [version, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          v=${{ needs.version.outputs.version }}
          mkdir -p dist
          cp artifacts/remotium-client-vsix/remotium-client.vsix "dist/remotium-client-$v.vsix"
          cp artifacts/binary-*/* dist/
          chmod +x dist/remotium-host-*
          (cd dist && sha256sum -- * > SHA256SUMS)
          prerelease=""; case "$v" in *-*) prerelease="--prerelease" ;; esac
          cat > notes.md <<EOF
          **remotium-host** (on the machine with your code): download the binary for your system,
          then \`chmod +x\` it and run \`./remotium-host --folder ~/project\`. It prints a pairing link.

          **Remotium Client** (desktop VSCodium): \`remotium-client-$v.vsix\`, or the download on the
          host's pairing page. Browsers need nothing.

          Checksums: \`SHA256SUMS\`.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --title "Remotium $v" --notes-file notes.md --generate-notes $prerelease

  open-vsx:
    needs: [version, ci, github-release]
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7
      - name: Skip without a token
        if: env.OVSX_PAT == ''
        run: echo "::notice::OVSX_PAT is not set; not publishing to Open VSX. See docs/releasing.md."
      - uses: actions/setup-node@v7
        if: env.OVSX_PAT != ''
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        if: env.OVSX_PAT != ''
        with:
          name: remotium-client-vsix
          path: vsix
      - name: Publish remotium.client
        if: env.OVSX_PAT != ''
        run: |
          pre=""; case "${{ needs.version.outputs.version }}" in *-*) pre="--pre-release" ;; esac
          npx --yes ovsx@1.3.0 verify-pat remotium -p "$OVSX_PAT"
          npx --yes ovsx@1.3.0 publish vsix/remotium-client.vsix -p "$OVSX_PAT" --skip-duplicate $pre

      # Store test: install the published version from Open VSX, as users will, and run the
      # first-install e2e (setup, restart, pair, connect) against a local remotium-host.
      - name: Wait until Open VSX serves the new version
        if: env.OVSX_PAT != ''
        run: |
          v=${{ needs.version.outputs.version }}
          for _ in $(seq 1 60); do
            curl -fs "https://open-vsx.org/api/remotium/client/$v" | grep -q '"files"' && exit 0
            sleep 10
          done
          echo "Open VSX doesn't list remotium.client $v after 10 minutes" >&2; exit 1
      - uses: dtolnay/rust-toolchain@stable
        if: env.OVSX_PAT != ''
      - name: Install from Open VSX and connect
        if: env.OVSX_PAT != ''
        env:
          E2E_CODIUM_ARGS: --no-sandbox
        run: |
          v=$(jq -r '.pinned.version + (if .pinned.release then "." + .pinned.release else "" end)' compat.json)
          mkdir -p "$RUNNER_TEMP/vscodium"
          curl -fsSL "https://github.com/VSCodium/vscodium/releases/download/$v/VSCodium-linux-x64-$v.tar.gz" | tar -xz -C "$RUNNER_TEMP/vscodium"
          export VSCODIUM_PATH="$RUNNER_TEMP/vscodium/codium"
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgbm1 libnss3 libasound2t64 >/dev/null
          cargo build --locked -p remotium-host
          npm --prefix client ci
          xvfb-run -a node client/test/e2e/first-install.js --vsix "remotium.client@${{ needs.version.outputs.version }}" --work "$RUNNER_TEMP/store-test"
