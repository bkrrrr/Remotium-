name: Release

# Publishes a part only when its version was bumped (scripts/set-version.sh):
#  - Server: remotium-host  → tag host-v<version>, GitHub Release with binaries for Linux
#    (static musl) and macOS, each with the current Remotium Client embedded
#  - Client: Remotium Client → tag client-v<version>, GitHub Release with the VSIX, and Open
#    VSX if the OVSX_PAT secret is set (followed by a store test)
# Pushes that don't bump a version do nothing here. "Run workflow" re-checks by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Which parts to publish
    runs-on: ubuntu-latest
    outputs:
      host: ${{ steps.p.outputs.host }}
      host_version: ${{ steps.p.outputs.host_version }}
      client: ${{ steps.p.outputs.client }}
      client_version: ${{ steps.p.outputs.client_version }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        run: |
          set -eu
          eval "$(scripts/versions.sh)"
          tag_exists() { git ls-remote --exit-code --tags origin "refs/tags/$1" >/dev/null 2>&1; }
          publish_host=true;   tag_exists "host-v$host"     && publish_host=false
          publish_client=true; tag_exists "client-v$client" && publish_client=false
          {
            echo "host=$publish_host"; echo "host_version=$host"
            echo "client=$publish_client"; echo "client_version=$client"
          } >> "$GITHUB_OUTPUT"
          {
            echo "| Part | Version | Publish |"
            echo "|---|---|---|"
            echo "| Server (remotium-host) | $host | $publish_host |"
            echo "| Client (VSCodium extension) | $client | $publish_client |"
          } >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    needs: plan
    if: needs.plan.outputs.host == 'true' || needs.plan.outputs.client == 'true'
    uses: ./.github/workflows/ci.yml

  host-binaries:
    name: Server (remotium-host) · build ${{ matrix.name }}
    needs: [plan, ci]
    if: needs.plan.outputs.host == 'true'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            name: linux-x86_64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            name: linux-aarch64
          - target: x86_64-apple-darwin
            runner: macos-latest
            name: macos-x86_64
          - target: aarch64-apple-darwin
            runner: macos-latest
            name: macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools >/dev/null
      - uses: actions/download-artifact@v8
        with:
          name: client - VSCodium extension (VSIX)
          path: vsix
      - name: Build (client embedded)
        env:
          REMOTIUM_CLIENT_VSIX: ${{ github.workspace }}/vsix/remotium-client.vsix
        run: |
          cargo build --release --locked -p remotium-host --target ${{ matrix.target }}
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/remotium-host" "dist/remotium-host-${{ needs.plan.outputs.host_version }}-${{ matrix.name }}"
      - name: Smoke test
        # The x86_64 macOS build is cross-compiled on an arm64 runner; skip running it.
        if: matrix.name != 'macos-x86_64'
        run: '"dist/remotium-host-${{ needs.plan.outputs.host_version }}-${{ matrix.name }}" --version'
      - uses: actions/upload-artifact@v7
        with:
          name: server - remotium-host ${{ matrix.name }}
          path: dist/

  host-release:
    name: Server (remotium-host) · GitHub Release
    needs: [plan, host-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: server - remotium-host *
          path: dist
          merge-multiple: true
      - name: Create host-v${{ needs.plan.outputs.host_version }}
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.plan.outputs.host_version }}
        run: |
          set -eu
          chmod +x dist/remotium-host-*
          (cd dist && sha256sum -- * > SHA256SUMS)
          pre="--latest"; case "$V" in *-*) pre="--prerelease" ;; esac
          cat > notes.md <<EOF
          **remotium-host** runs on the machine with your code. Download the binary for your
          system, \`chmod +x\` it, and run \`./remotium-host --folder ~/project\`. It prints a
          pairing link for the browser and for desktop VSCodium. Checksums: \`SHA256SUMS\`.
          EOF
          gh release create "host-v$V" dist/* --target "$GITHUB_SHA" --title "Remotium Host $V" --notes-file notes.md $pre

  client-release:
    name: Client (VSCodium extension) · GitHub Release
    needs: [plan, ci]
    if: needs.plan.outputs.client == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: client - VSCodium extension (VSIX)
          path: vsix
      - name: Create client-v${{ needs.plan.outputs.client_version }}
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.plan.outputs.client_version }}
        run: |
          set -eu
          mkdir -p dist
          cp vsix/remotium-client.vsix "dist/remotium-client-$V.vsix"
          (cd dist && sha256sum -- * > SHA256SUMS)
          pre="--latest=false"; case "$V" in *-*) pre="--prerelease" ;; esac
          cat > notes.md <<EOF
          **Remotium Client** for desktop VSCodium: drag \`remotium-client-$V.vsix\` onto the
          Extensions view (or search Remotium on Open VSX). On first start it asks once to
          finish its setup. Checksums: \`SHA256SUMS\`.
          EOF
          gh release create "client-v$V" dist/* --target "$GITHUB_SHA" --title "Remotium Client $V" --notes-file notes.md $pre

  open-vsx:
    name: Client (VSCodium extension) · Open VSX
    needs: [plan, client-release]
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      V: ${{ needs.plan.outputs.client_version }}
    steps:
      - uses: actions/checkout@v7
      - name: Skip without a token
        if: env.OVSX_PAT == ''
        run: echo "::notice::OVSX_PAT is not set; not publishing to Open VSX. See docs/releasing.md."
      - uses: actions/setup-node@v7
        if: env.OVSX_PAT != ''
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        if: env.OVSX_PAT != ''
        with:
          name: client - VSCodium extension (VSIX)
          path: vsix
      - name: Publish remotium.client
        if: env.OVSX_PAT != ''
        run: |
          pre=""; case "$V" in *-*) pre="--pre-release" ;; esac
          npx --yes ovsx@1.3.0 verify-pat remotium -p "$OVSX_PAT"
          npx --yes ovsx@1.3.0 publish vsix/remotium-client.vsix -p "$OVSX_PAT" --skip-duplicate $pre

      # Store test: install the published version from Open VSX, as users will, and run the
      # first-install e2e (setup, restart, pair, connect) against a local remotium-host.
      - name: Wait until Open VSX serves the new version
        if: env.OVSX_PAT != ''
        run: |
          for _ in $(seq 1 60); do
            curl -fs "https://open-vsx.org/api/remotium/client/$V" | grep -q '"files"' && exit 0
            sleep 10
          done
          echo "Open VSX doesn't list remotium.client $V after 10 minutes" >&2; exit 1
      - uses: dtolnay/rust-toolchain@stable
        if: env.OVSX_PAT != ''
      - name: Install from Open VSX and connect
        if: env.OVSX_PAT != ''
        env:
          E2E_CODIUM_ARGS: --no-sandbox
        run: |
          v=$(jq -r '.pinned.version + (if .pinned.release then "." + .pinned.release else "" end)' compat.json)
          mkdir -p "$RUNNER_TEMP/vscodium"
          curl -fsSL "https://github.com/VSCodium/vscodium/releases/download/$v/VSCodium-linux-x64-$v.tar.gz" | tar -xz -C "$RUNNER_TEMP/vscodium"
          export VSCODIUM_PATH="$RUNNER_TEMP/vscodium/codium"
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgbm1 libnss3 libasound2t64 >/dev/null
          cargo build --locked -p remotium-host
          npm --prefix client ci
          xvfb-run -a node client/test/e2e/first-install.js --vsix "remotium.client@$V" --work "$RUNNER_TEMP/store-test"
