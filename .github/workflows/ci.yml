name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Catch VSCodium releases that change the proposed API or the server layout.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  # The release workflow runs the same checks before publishing anything.
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test (unit + host integration with a fake VSCodium server)
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: remotium-client-vsix
          path: client/remotium-client.vsix

  # Real VSCodium (under Xvfb) and headless Chromium against a real remotium-host.
  e2e:
    needs: [rust, client]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        vscodium: [pinned, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Pick the VSCodium version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ matrix.vscodium }}" = pinned ]; then
            v=$(jq -r '.pinned.version + (if .pinned.release then "." + .pinned.release else "" end)' compat.json)
          else
            v=$(gh api repos/VSCodium/vscodium/releases/latest --jq .tag_name)
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "VSCodium $v"

      - name: Download VSCodium
        run: |
          v=${{ steps.version.outputs.version }}
          mkdir -p "$RUNNER_TEMP/vscodium"
          curl -fsSL "https://github.com/VSCodium/vscodium/releases/download/$v/VSCodium-linux-x64-$v.tar.gz" | tar -xz -C "$RUNNER_TEMP/vscodium"
          echo "VSCODIUM_PATH=$RUNNER_TEMP/vscodium/codium" >> "$GITHUB_ENV"

      - name: Build remotium-host
        run: cargo build --locked -p remotium-host

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgbm1 libnss3 libasound2t64 >/dev/null
          npm --prefix client ci
          npx --prefix client playwright install --with-deps chromium

      - name: First install with the packaged client (setup, restart, pair, connect)
        env:
          E2E_CODIUM_ARGS: --no-sandbox
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          xvfb-run -a npm --prefix client run test:e2e:vsix -- --work "$RUNNER_TEMP/e2e/first-install"

      - name: Phase 3 (terminal, port forwarding, debugging, host restart)
        env:
          E2E_CODIUM_ARGS: --no-sandbox
        run: xvfb-run -a npm --prefix client run test:phase3 -- --work "$RUNNER_TEMP/e2e/phase3"

      - name: Browser access (Chromium)
        if: matrix.vscodium == 'pinned'
        run: npm --prefix client run test:browser -- --work "$RUNNER_TEMP/e2e/browser"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-${{ matrix.vscodium }}
          path: ${{ runner.temp }}/e2e
